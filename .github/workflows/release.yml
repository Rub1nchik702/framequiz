name: Publish Windows release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Cargo.toml']
permissions:
  contents: write
concurrency: framequiz-windows-release
jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile studio
        run: cargo build --locked --release
      - name: Prepare packaged dependencies
        shell: pwsh
        run: |
          gh release download --pattern Framequiz-Windows.zip --dir previous
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Expand-Archive previous/Framequiz-Windows.zip previous/files
          New-Item -ItemType Directory dist
          Copy-Item previous/files/ffmpeg.exe,previous/files/FFmpeg-COPYING.txt dist
          Invoke-WebRequest https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/1.0.3650.58/microsoft.web.webview2.1.0.3650.58.nupkg -OutFile sdk.zip
          Expand-Archive sdk.zip sdk
      - name: Package and publish
        id: publish
        shell: pwsh
        run: |
          python tools/package.py --webview-sdk sdk
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          "version=$version" >> $env:GITHUB_OUTPUT
          gh release create "v$version" dist/Framequiz-Windows.zip dist/Framequiz-Update.exe --target $env:GITHUB_SHA --title "Framequiz Studio $version" --generate-notes

      - name: Verify the actual 0.2.0 client upgrade
        if: steps.publish.outputs.version == '0.2.1'
        shell: pwsh
        run: ./tools/Test-Upgrade020.ps1 -PreviousZip previous/Framequiz-Windows.zip -NewZip dist/Framequiz-Windows.zip

      - name: Verify graphical updater from released 0.2.1 without GitHub CLI
        if: steps.publish.outputs.version == '0.2.2'
        shell: powershell
        run: ./tools/Test-Upgrade021.ps1 -PreviousZip previous/Framequiz-Windows.zip -NewZip dist/Framequiz-Windows.zip -Updater dist/Framequiz-Update.exe
